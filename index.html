<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finn Project Portfolio</title>
    <style>
        /* This removes all edges, scrolling, and backgrounds from the website */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        /* This forces the portfolio viewer to take up the absolute entire screen */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- %20 tells the website browser how to safely read spaces in file names -->
    <iframe src="Finn%20Project%20Portfolio.pdf"></iframe>

</body>
</html>
