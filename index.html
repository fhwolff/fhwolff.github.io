<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project Portfolio</title>
    <style>
        /* Modern, minimal layout styling */
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #0f172a; /* Sleek dark slate background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 24px 0;
            text-align: center;
            color: #ffffff;
        }
        h1 { 
            margin: 0 0 8px 0; 
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.05em;
        }
        p {
            margin: 0;
            color: #94a3b8; /* Light gray subtitle text */
            font-size: 1rem;
        }
        .container {
            width: 90%;
            max-width: 1100px;
            height: 78vh; /* Sets a great viewing height for the PDF */
            margin-bottom: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            overflow: hidden;
            background-color: #1e293b;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <header>
        <h1>Project Portfolio</h1>
        <p>Welcome! Scroll through the document below to view my work.</p>
    </header>

    <div class="container">
        <!-- This embeds your PDF seamlessly into the webpage -->
        <iframe src="Finn Project Portfolio.pdf"></iframe>
    </div>

</body>
</html>
